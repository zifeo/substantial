[project]
name = "substantial"
version = "0.2.0-beta.1"
description = "Brokerless durable execution: the Python host of the Substantial core"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28.1",
  "protobuf>=7.36.2,<8",
  "wasmtime>=50.0.1",
]

[project.urls]
Repository = "https://github.com/zifeo/substantial"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/substantial"]

# The core ships inside the package; the repository keeps its only copy in wasm/.
[tool.hatch.build.targets.wheel.force-include]
"wasm/substantial.wasm" = "substantial/wasm/substantial.wasm"
"wasm/SHA256SUMS" = "substantial/wasm/SHA256SUMS"

# only-include, not include: a full walk meets rust/wasm, a symlink to wasm/, first and skips wasm/.
[tool.hatch.build.targets.sdist]
only-include = [
  "python/substantial",
  "wasm/substantial.wasm",
  "wasm/SHA256SUMS",
  "LICENSE",
  "README.md",
]

[tool.uv]
# The editable install copies the core into the environment: rebuild it when the core changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "wasm/substantial.wasm" },
  { file = "wasm/SHA256SUMS" },
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["python/substantial/boundary/*", "python/substantial/layout/*"]

[tool.ruff]
src = ["python"]
include = ["python/**/*.py", "python/**/*.pyi"]
extend-exclude = ["python/substantial/layout", "python/substantial/boundary"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# `run.result(timeout=)` is the API of docs/interfaces.md (I-17).
ignore = ["ASYNC109"]
