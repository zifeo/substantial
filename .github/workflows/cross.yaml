name: Cross-language

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: docker compose -f dev/compose.yaml up -d --wait
      - run: uv sync --locked
      - run: npm ci
      - run: uv run dev/cross/run.py
