repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=768
      - id: check-ast
      - id: check-json
        exclude: .vscode/.*\.json
      - id: check-toml
      - id: check-yaml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.17.3"
    hooks:
      - id: ruff
        args:
          - --fix
      # Python files only, as CI checks: the hook would also reflow the examples of the docs.
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages:
          - commit-msg
  - repo: https://github.com/yoheimuta/protolint
    rev: v0.51.0
    hooks:
      - id: protolint
        args:
          - -fix
  # Silcrow's own hook: `silcrow install` leaves this file's pre-commit hook to pre-commit. Silcrow
  # is not public yet, so a contributor without it skips the hook rather than being blocked.
  - repo: local
    hooks:
      - id: silcrow
        name: silcrow
        entry: sh -c 'if command -v silcrow >/dev/null; then exec silcrow hook pre-commit; else echo "silcrow is not installed, skipped"; fi'
        language: system
        pass_filenames: false
        always_run: true
