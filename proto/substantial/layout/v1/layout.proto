// The objects of layout 3, the head layout (docs/interfaces.md). Every object of a namespace but its
// marker, substantial.json, and its empty markers is one of these messages in protobuf binary
// encoding: runs/<id> a Run, a message's due entry a Message. The core alone encodes them, for every
// host, so the bytes are the same everywhere: no map fields, whose order would vary.
// § sqbjc1adw@b3cmx
syntax = "proto3";

package substantial.layout.v1;

// Milliseconds since the Unix epoch, UTC.
message Time {
  int64 ms = 1;
}

// A value of the code: JSON as the hosts give it, or raw bytes.
message Value {
  // A reference to a value stored apart, not implemented.
  reserved 3;
  oneof kind {
    bytes json = 1;
    bytes raw = 2;
  }
}

message Failure {
  string type = 1;
  string message = 2;
  bool retryable = 3;
  // JSON. The failures the core makes hold the one they wrap: StepFailed {"step", "attempts",
  // "error"}, error the last attempt's failure as {"type", "message", "retryable", "details"}, such
  // as ValueTooLarge for a value past the limit; RunFailed, a child's end, {"run", "status", "error",
  // "reason"}.
  Value details = 4;
}

message Parent {
  string run = 1;
  uint64 occurrence = 2;
  // The parent's segment whose effects start the child.
  uint64 segment = 3;
  // c.start(..., abandon): the parent's end does not cancel this child.
  bool abandon = 4;
}

// A message id a run consumed, and when: the at of its message event.
message Seen {
  string id = 1;
  Time at = 2;
}

// What a run is: in its head, and in its archive.
message Start {
  string workflow = 1;
  optional uint32 version = 2;
  Value input = 3;
  string chain = 4;
  uint64 seq = 5;
  optional string previous = 6;
  optional string resumes = 7;
  Parent parent = 8;
  Value state = 9;
  // The workflow's locals, which no host captures.
  reserved 10;
  repeated string carried = 11;
  // Ids without their consume time, before layout 1 was released.
  reserved 12;
  Time created_at = 13;
  // Message ids consumed within dedup_window, each expiring dedup_window after its own time.
  repeated Seen seen = 14;
  // A retry only: the first run of its line of retries, from which it derives the ids of its
  // children, sends and continuation, so the history it resumes matches its calls.
  optional string line = 15;
  // The run's limits: the start's own, else its workflow's; part of the start's identity, carried by
  // continuations, set again or kept by a retry. None means no limit.
  Budget budget = 16;
  // The chain's cost before this run: of the runs it continues or the ended run it retries or resets.
  Cost cost = 17;
  // A reset only: how many events of the run it resumes it replays, as history numbers them; the
  // messages that run consumed after them are consumed again. Absent for a retry of a failed run.
  optional uint64 keep = 18;
  // A run of the chain before this one started a child it did not abandon: this run's end cancels
  // the children of the chain not yet ended. Set from the end segment of the run it continues.
  bool children = 19;
}

// An integer amount of nano-units of an ISO 4217 currency, at most 2^63-1.
message Amount {
  string currency = 1;
  uint64 nano = 2;
}

// Store requests by kind, each attempt of an operation one request.
message Requests {
  uint64 create = 1;
  uint64 get = 2;
  uint64 list = 3;
  uint64 delete = 4;
  uint64 cas = 5;
}

// Requests and amounts, the amounts sorted by currency, one per currency.
message Meters {
  Requests requests = 1;
  repeated Amount amounts = 2;
}

// What a step charged, by its name.
message StepCharges {
  string step = 1;
  repeated Amount amounts = 2;
}

// What a chain cost: its own store requests, priced by the price table of the worker that counted
// them if it had one; its steps' charges, sorted by step name; and its children's totals.
message Cost {
  Meters store = 1;
  repeated StepCharges steps = 2;
  Meters children = 3;
}

// A limit on a meter: a request kind (create, get, list, delete, requests) or a currency.
message Limit {
  string meter = 1;
  uint64 limit = 2;
}

// Limits sorted by meter, one per meter.
message Budget {
  repeated Limit limits = 1;
}

message Step {
  string name = 1;
  uint64 occurrence = 2;
  uint32 attempt = 3;
  Value value = 4;
  // What the attempt charged, sorted by currency.
  repeated Amount charges = 5;
}

message StepRetry {
  string name = 1;
  uint64 occurrence = 2;
  uint32 attempt = 3;
  Failure error = 4;
  Time at = 5;
  repeated Amount charges = 6;
  // The step's deadline, Retry(deadline=): its first attempt's start plus the deadline, past which
  // no attempt starts; absent for a step without one.
  Time deadline = 7;
}

message StepFailed {
  string name = 1;
  uint64 occurrence = 2;
  uint32 attempt = 3;
  Failure error = 4;
  repeated Amount charges = 5;
}

message Timer {
  uint64 occurrence = 1;
  Time until = 2;
}

message Fired {
  uint64 occurrence = 1;
}

message MessageConsumed {
  string key = 1;
  string id = 2;
  string name = 3;
  // Exactly one of value and ended; ended only for substantial.ended and substantial.watched.
  Value value = 4;
  Ended ended = 5;
  // When the run consumed it, the run machine's now: its dedup_window starts there.
  Time at = 6;
}

message Child {
  uint64 occurrence = 1;
  string run = 2;
  string workflow = 3;
  optional uint32 version = 4;
  Value input = 5;
  // The child's budget, given to its start.
  Budget budget = 6;
  // c.start(..., abandon): the parent's end does not cancel this child (Parent.abandon).
  bool abandon = 7;
}

message Sent {
  uint64 occurrence = 1;
  // The chain the code sent to.
  string run = 2;
  string id = 3;
  string name = 4;
  Value value = 5;
  // What the replay read of the chain before the commit, which every replay gives the code again:
  // the run the message goes to, or the error the send raised, nothing sent.
  oneof outcome {
    Delivery to = 6;
    Failure refused = 7;
  }
}

// A workflow's send accepted: the chain's last run when it was read, and its workflow, which names
// the message's due entry.
message Delivery {
  string run = 1;
  string workflow = 2;
}

// The code awaited the end of a chain (c.result): what its replay read before the commit, which
// every replay gives the code again.
message Watched {
  uint64 occurrence = 1;
  // The chain awaited.
  string chain = 2;
  oneof outcome {
    // The chain's current run when watch/<chain>/<watcher> was created: its end arrives as
    // a substantial.watched message.
    string waiting = 3;
    // The chain's end, read before or just after the watcher key was created.
    Ended ended = 4;
    // RunNotFound: no such chain, or one past its retention.
    Failure refused = 5;
  }
}

// The code asked c.patched(id) live: every replay that reaches this point answers true, and one of
// a history without it answers false.
message Patched {
  string id = 1;
}

message Published {
  string key = 1;
  Value value = 2;
}

message Completed {
  Value value = 1;
}

message Failed {
  Failure error = 1;
}

message Cancelled {
  string reason = 1;
}

// The run passed a limit of its budget at a decision point: recorded once, so a replay never decides
// again. From here every blocked call raises BudgetExceeded and the run ends failed with it.
message BudgetExceeded {
  string meter = 1;
  uint64 limit = 2;
  uint64 used = 3;
}

// The next run's start is built from this event alone, so whoever does the effects needs no more.
message Continued {
  string run = 1;
  string workflow = 2;
  Value input = 3;
  Value state = 4;
  // The workflow's locals, which no host captures.
  reserved 5;
  repeated string carried = 6;
  // Ids without their consume time, before layout 1 was released.
  reserved 7;
  // The next run's version: the run's own when it continues as itself.
  optional uint32 version = 8;
  repeated Seen seen = 9;
}

message Event {
  oneof kind {
    Step step = 1;
    StepRetry step_retry = 2;
    StepFailed step_failed = 3;
    Timer timer = 4;
    Fired fired = 5;
    MessageConsumed message = 6;
    Child child = 7;
    Sent sent = 8;
    Published published = 9;
    Completed completed = 10;
    Failed failed = 11;
    Cancelled cancelled = 12;
    Continued continued = 13;
    BudgetExceeded budget_exceeded = 14;
    Watched watched = 15;
    Patched patched = 16;
  }
}

// Segment n of a run, in its head.
message Segment {
  uint64 n = 1;
  repeated Event events = 2;
  // For a suspension, the earliest of its pending timers and step retries, absent when the run only
  // waits on messages; for a progress commit, its own created_at, so the run is due at once if the
  // replay stops; absent for an end.
  Time next_wake = 3;
  string worker = 4;
  Time created_at = 5;
  // Milliseconds, before retention was whole days.
  reserved 6;
  reserved "retention_ms";
  // On an end segment, how many whole days the run is kept after it ends; absent on any other.
  optional uint32 retention_days = 10;
  // The rest marker, queues/<workflow>/rest/<chain>, exists: set by the suspension that
  // created it, waiting on messages only, and kept by every later segment of the run.
  bool rest = 7;
  // The chain's cost through this segment, its own commit's planned requests included.
  Cost cost = 8;
  // On an end segment: the run, or a run of its chain before it (Start.children), started a child it
  // did not abandon. An end other than a continuation then cancels the children of the chain not
  // yet ended; a continuation passes it on to the next run's start. A cancellation cancels them
  // whatever it says, as before this field existed.
  bool children = 9;
}

// A segment whose events a head's resumed events hold: the run that wrote it, a run a retry or a
// reset resumes, its number and time, and how many of the events that follow are its.
message Origin {
  string run = 1;
  uint64 n = 2;
  Time created_at = 3;
  uint64 events = 4;
}

// A message's due entry, queues/<workflow>/due/19700101t000000000z~<chain>~m<ord>-<id>, and a
// message a head holds (Inboxed).
message Message {
  string id = 1;
  string name = 2;
  // Exactly one of value and ended; ended only for substantial.ended and substantial.watched.
  Value value = 3;
  Time sent_at = 4;
  Ended ended = 5;
}

// What a child's substantial.ended tells its parent, and substantial.watched a run awaiting the chain:
// the end of its chain, as its result says.
message Ended {
  string run = 1;
  Status status = 2;
  Value value = 3;
  Failure error = 4;
  string reason = 5;
  // The child chain's cost, as its end segment recorded it.
  Cost cost = 6;
}

// A worker's claim on a chain's current run, in its head: it runs the run's steps until at plus
// ttl_ms.
message Lease {
  string worker = 1;
  Time at = 2;
  uint64 ttl_ms = 3;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_COMPLETED = 1;
  STATUS_FAILED = 2;
  STATUS_CANCELLED = 3;
  STATUS_CONTINUED = 4;
}

// What a client reads of a run that ended, built from its end segment.
message Result {
  Status status = 1;
  Value value = 2;
  Failure error = 3;
  string reason = 4;
  optional string next = 5;
  Time ended_at = 6;
  // Before expiry replaced collection.
  reserved 7;
  reserved "written_at";
}

// The latest block of a chain's current run, in its head: a hint, the replay that would write
// segment n raised an error that is no end, or diverged from the history; nothing of it was
// recorded. Its queue's marker queues/<workflow>/blocked/<chain> is empty.
message Blocked {
  Failure error = 1;
  // When the replay was dropped, by its worker's clock.
  Time at = 2;
  string worker = 3;
  // The time of the due entry that tries the run again.
  Time retry_at = 4;
  // The blocks in a row at segment n before this one.
  uint32 attempt = 5;
  // The segment the replay would have written.
  uint64 n = 6;
}

// runs/<id>: the head of the chain <id>, the archive of a run <id> that is not its chain's
// current run, or, while a later run <id> of a chain is its current run, a pointer to the chain.
message Run {
  oneof kind {
    Head head = 1;
    Pointer pointer = 2;
  }
}

// A later run of a chain, while it is the chain's current run: runs/<chain> holds it.
message Pointer {
  string chain = 1;
}

// A message the chain accepted and no run of it consumed yet, under its name in the chain,
// <ord>-<id>, the key its consumption records.
message Inboxed {
  string key = 1;
  Message body = 2;
}

// The chain of a child's parent, and the workflow whose queue its notices go to.
message ParentChain {
  string chain = 1;
  string workflow = 2;
}

// A run: at runs/<chain>, the chain's head, its current run; at runs/<run> for a later run, or
// archives/<chain> for a chain's first run, the archive of a run that continued, was retried or
// was reset, its head as the commit that replaced it fixed it.
message Head {
  string run = 1;
  Start start = 2;
  // A retry's or a reset's: the events of the runs it resumes that it replays, and their
  // segments, one Origin per segment.
  repeated Event resumed = 3;
  repeated Origin origins = 4;
  // The run's own segments, 0 to n-1.
  repeated Segment segments = 5;
  // The messages the chain accepted and no run consumed: those start.carried names first, in that
  // order, then by key.
  repeated Inboxed inbox = 6;
  Lease lease = 7;
  // The segment whose effects may be missing; with archive, the continuation or the retry
  // whose archive and pointer may be missing.
  optional uint64 pending = 8;
  // A continuation's or a retry's while pending: the run before as its archive holds it.
  bytes archive = 9;
  // The latest value published under each key by the chain, sorted by key.
  repeated Published published = 10;
  ParentChain parent = 11;
  // Children the chain's earlier runs started whose end it did not consume: the cancel an end owes,
  // and the children whose substantial.ended the chain accepts.
  repeated string children = 12;
  Blocked blocked = 13;
  // Before every run expired after its own end, whatever its children.
  reserved 14, 15, 17;
  reserved "kept", "expiry_days", "kept_archives";
  // A later run's: the etag of its pointer, for the cas that gives it its expiry or replaces it by
  // its archive.
  string pointer_etag = 16;
  // An archive's: the run that replaced it, its continuation, retry or reset.
  string next = 18;
  // The start of the chain's first run, once the head holds a later run: a start of the chain's
  // id compares with it, whatever became of that run's archive.
  Start first = 19;
}
