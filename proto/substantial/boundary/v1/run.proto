// The run machine, opened for one replay; the host's scheduler drives it (I-23).
syntax = "proto3";

package substantial.boundary.v1;

import "substantial/boundary/v1/boundary.proto";
import "substantial/layout/v1/layout.proto";

message RunSettings {
  uint64 commit_every_ms = 1;
  uint64 continue_as_new_after_segments = 2;
  uint64 continue_as_new_after_bytes = 3;
  uint64 dedup_window_ms = 4;
  // Required: recorded on the run's end segment.
  Retention retention = 5;
  // The store's prices: the money of each store request counted for a run, by the agent and by the
  // run machine (a workflow's send's reads). Absent, the requests are counted and no money is.
  Prices prices = 6;
  // The run's limits, each required and positive: its history's encoded bytes and events, the
  // inbox messages one replay consumes, and the message ids a continuation carries. Passing one
  // ends the run failed with HistoryTooLarge.
  uint64 max_history_bytes = 7;
  uint64 max_history_events = 8;
  uint64 max_replay_inbox = 9;
  uint64 max_seen = 10;
  // 1 to 100: a commit that takes a run past this share of one of its limits says so
  // (Commit.near_limits), once.
  uint32 history_warn_percent = 11;
}

// One ISO 4217 currency and integer nano-units per 1,000 requests of each kind, each at most
// 2^63-1; a request costs its share rounded up.
message Prices {
  string currency = 1;
  uint64 create = 2;
  uint64 get = 3;
  uint64 list = 4;
  uint64 delete = 5;
  // Required with the others: a cas is a write as a create is (an S3 PUT).
  uint64 cas = 6;
}

// How many whole days an ended run is kept, 1 to 36,500, counted from its own end whatever its
// children do, then removed by its expiry.
message Retention {
  reserved 1, 2;
  reserved "ms", "forever";
  uint32 days = 3;
}

message InboxMessage {
  // The message's name in its chain, <ord>-<id>, which its consumption records.
  string key = 1;
  layout.v1.Message body = 2;
}

// Opens a run machine for one replay.
message RunInput {
  string run = 1;
  layout.v1.Start start = 2;
  // Every recorded event: the resumed ones of a retry or a reset, then the run's segments'.
  repeated layout.v1.Event history = 3;
  uint64 history_bytes = 4;
  uint64 next_n = 5;
  // The messages the head holds, those start.carried names first, then the messages served and
  // listed, the whole sorted by key after the carried ones.
  repeated InboxMessage inbox = 6;
  layout.v1.Time now = 7;
  // 32 bytes, the seed of the run's ChaCha20 generator, which draws random and uuid live only.
  bytes seed = 8;
  string worker = 9;
  RunSettings settings = 10;
  // The namespace, whose keys a workflow's send reads its chain under (Next.store).
  string prefix = 11;
  reserved 12;
  reserved "partitions";
  // The chain's cost as the agent knows it at the open: the last segment's, or the start's, and the
  // requests of this wakeup so far.
  layout.v1.Cost cost = 13;
  // The highest version of the run's workflow the worker serves, absent if it serves none: where a
  // continuation with highest goes.
  optional uint32 highest_version = 14;
  // The agent holds no lease of the run: the machine answers Next.claim before the first step
  // attempt it starts, and a replay that starts none runs without one.
  bool claim = 15;
}

message RetryPolicy {
  uint32 max_attempts = 1;
  uint64 initial_ms = 2;
  uint64 max_ms = 3;
  double multiplier = 4;
  // Retry(deadline=), schedule to close: from the start of the step's first attempt, no attempt
  // starts past it, and each runs at most until it; absent, none.
  optional uint64 deadline_ms = 5;
}

message StepOptions {
  RetryPolicy retry = 1;
  optional uint64 timeout_ms = 2;
  bool undo = 3;
  optional uint64 saga = 4;
  // Set for an undo only: the occurrence of the step it undoes.
  optional uint64 occurrence = 5;
}

message End {
  message Continued {
    optional string workflow = 1;
    layout.v1.Value input = 2;
    layout.v1.Value state = 3;
    // The workflow's locals, which no host captures.
    reserved 4;
    // The version of workflow, given only with it; absent, its runs without a version. Naming the
    // run's own workflow with a version continues into that version; with neither, the run
    // continues as itself, its version kept.
    optional uint32 version = 5;
    // Without workflow: continue as itself into the highest version of its workflow the worker
    // serves (RunInput.highest_version), its own version if the worker serves none.
    bool highest = 6;
  }
  oneof end {
    layout.v1.Completed completed = 1;
    // Only with an error the code let through that is the recorded outcome of a Substantial call:
    // Fail, StepFailed, BudgetExceeded, RolledBack, UndoFailed, HistoryTooLarge, RunFailed,
    // WaitTimeout, RunNotFound or RunEnded. Any other error, NonDeterminism and the ValueTooLarge of a
    // refused call included, and a result that does not encode as JSON, blocks the run instead
    // (ReplayEnd.blocked).
    layout.v1.Failed failed = 2;
    layout.v1.Cancelled cancelled = 3;
    Continued continued = 4;
  }
}

message Call {
  message Step {
    string name = 1;
    StepOptions options = 2;
  }
  message Wait {
    optional uint64 timeout_ms = 1;
  }
  message Bind {
    repeated string names = 1;
  }
  message Start {
    string workflow = 1;
    optional uint32 version = 2;
    layout.v1.Value input = 3;
    optional string id = 4;
    // The child's budget: the one c.start was given, else the child workflow's; absent, none.
    layout.v1.Budget budget = 5;
    // c.start(..., abandon=True): the child goes on when this run ends; by default the run's end,
    // completed, failed or cancelled, cancels it.
    bool abandon = 6;
  }
  message Send {
    string run = 1;
    string name = 2;
    layout.v1.Value value = 3;
    optional string id = 4;
  }
  // substantial.cancel holding reason, to a child this run started; answered and recorded as a send.
  message Cancel {
    string run = 1;
    string reason = 2;
  }
  // The end of the chain `chain`, child or not (c.result): resolved with its value, RunFailed or
  // RunNotFound; past timeout_ms, by the run's timer, with WaitTimeout. Never the run's own chain.
  message ChainResult {
    string chain = 1;
    optional uint64 timeout_ms = 2;
  }
  // With highest, also true when the worker serves a version of the run's workflow higher than the
  // run's (RunInput.highest_version).
  message ShouldContinue {
    bool highest = 1;
  }
  message SagaEnd {
    uint64 saga = 1;
    bool failed = 2;
    // The saga open around this one, if any: ended without an error, its steps become that saga's.
    optional uint64 parent = 3;
  }
  oneof call {
    Step step = 1;
    Empty now = 2;
    Empty random = 3;
    Empty uuid = 4;
    uint64 sleep_ms = 5;
    layout.v1.Time sleep_until = 6;
    Wait wait = 7;
    string receive = 8;
    Bind bind = 9;
    Start start = 10;
    string child_result = 11;
    Send send = 12;
    layout.v1.Published publish = 13;
    Empty saga_begin = 14;
    SagaEnd saga_end = 15;
    Empty rollback = 16;
    layout.v1.Value iterate = 17;
    ShouldContinue should_continue_as_new = 18;
    End end = 19;
    // The chain's cost so far, recorded as now is.
    Empty cost = 20;
    Cancel cancel = 21;
    ChainResult chain_result = 22;
    // c.patched(id): answered with a JSON boolean, recorded as a patched event when live.
    string patched = 23;
  }
}

// A message handed to the code's handlers.
message Message {
  string id = 1;
  string name = 2;
  layout.v1.Value value = 3;
}

message Undo {
  uint64 call = 1;
  string name = 2;
  uint64 occurrence = 3;
  layout.v1.Value value = 4;
}

message Called {
  message Messages {
    repeated Message messages = 1;
  }
  message Undos {
    repeated Undo undos = 1;
  }
  oneof called {
    uint64 pending = 1;
    Messages messages = 2;
    string run = 3;
    uint64 saga = 4;
    Undos undos = 5;
    layout.v1.Value value = 6;
    Empty done = 7;
    // The call raised this failure: BudgetExceeded for a child start or a send past the budget.
    layout.v1.Failure failed = 10;
  }
  // Set for a step call: its occurrence, the one of its step key (I-6).
  optional uint64 occurrence = 8;
  // The replay passed the end of the recorded history: the code runs new code from this answer on.
  bool live = 9;
}

message Outcome {
  oneof outcome {
    layout.v1.Value value = 1;
    layout.v1.Failure error = 2;
  }
}

message Resolution {
  oneof resolution {
    layout.v1.Value value = 1;
    // StepFailed for a step, RunFailed for a child's result: details give the failure they wrap.
    layout.v1.Failure error = 2;
    string cancelled = 3;
  }
}

enum CommitKind {
  COMMIT_KIND_UNSPECIFIED = 0;
  // The replay goes on in memory.
  COMMIT_KIND_PROGRESS = 1;
  COMMIT_KIND_SUSPEND = 2;
  COMMIT_KIND_END = 3;
}

// A limit of the run (RunSettings) and what the run uses of it.
message LimitUse {
  // history_bytes, history_events, replay_inbox or seen.
  string limit = 1;
  uint64 used = 2;
  uint64 max = 3;
}

message Commit {
  CommitKind kind = 1;
  layout.v1.Segment segment = 2;
  // Message keys this commit consumed or dropped as duplicates: their due entries are deleted once
  // it is durable.
  repeated string consumed = 3;
  // The limits this commit takes the run past history_warn_percent of, which no earlier commit of
  // the run passed: the host warns and tells its observer.
  repeated LimitUse near_limits = 4;
}

// Steps are in flight; until is the earliest timer or retry, when the host calls next again anyway.
message WaitSteps {
  layout.v1.Time until = 1;
}

// Nothing was recorded: no segment to write.
message Idle {
  layout.v1.Time next_wake = 1;
}

message Next {
  message Resolve {
    uint64 call = 1;
    Resolution resolution = 2;
  }
  message Execute {
    uint64 call = 1;
    uint32 attempt = 2;
    optional uint64 timeout_ms = 3;
  }
  oneof next {
    Resolve resolve = 1;
    Message deliver = 2;
    Execute execute = 3;
    Commit commit = 4;
    WaitSteps wait_steps = 5;
    Idle idle = 6;
    // A child's chain ended, its substantial.ended consumed: the run its start answered. The
    // child's result calls resolve after it.
    string child_ended = 7;
    // An operation of a workflow's send, reads of the chain it sends to, or of a c.result's
    // registration, reads and the create of its watcher key, before the replay goes on: the host
    // performs it on the namespace's store and answers RunRequest.stored before the next `next`.
    // A store that fails after the adapter's retries drops the replay.
    StoreOp store = 9;
    // The code diverged from the recorded history (NonDeterminism), or ended with a result, a
    // continuation's input or state past the value limit (ValueTooLarge): nothing is recorded. The
    // host stops the code and its attempts, as for a dropped replay, and reports the replay blocked
    // with this error (ReplayEnd.blocked).
    layout.v1.Failure blocked = 10;
    // A step attempt is about to start and the agent holds no claim: the host sends
    // AgentRequest.claim with the run and waits. At AgentCommand.claimed it answers
    // RunRequest.claimed, then asks `next` again; at AgentCommand.stop_replay it drops the replay,
    // which started no attempt, and reports it dropped.
    Empty claim = 11;
  }
  // As Called.live.
  bool live = 8;
}

message RunRequest {
  message MakeCall {
    Call call = 1;
    layout.v1.Time now = 2;
  }
  message StepEnded {
    uint64 call = 1;
    uint32 attempt = 2;
    Outcome outcome = 3;
    layout.v1.Time now = 4;
    // What the attempt charged (s.charge), in call order; the core sums them by currency.
    repeated layout.v1.Amount charges = 5;
  }
  // The messages of AgentCommand.Committed.inbox.
  message Arrived {
    repeated InboxMessage messages = 1;
    // AgentCommand.Committed.cost: sent after every progress commit won, messages or not.
    layout.v1.Cost cost = 2;
  }
  oneof request {
    MakeCall call = 1;
    StepEnded step_ended = 2;
    uint64 satisfied = 3;
    layout.v1.Time next = 4;
    Arrived arrived = 5;
    // The answer to Next.store: bytes or missing for a get, a listing for a list, created or exists
    // for a create; never failed.
    OpResult stored = 6;
    // The answer to Next.claim once the agent sent AgentCommand.claimed.
    Empty claimed = 7;
  }
}

message RunResponse {
  oneof response {
    CoreError error = 1;
    Called called = 2;
    Next next = 3;
    Empty done = 4;
  }
}
