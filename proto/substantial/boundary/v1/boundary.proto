// The messages of the WASM boundary (docs/interfaces.md, I-23 and I-25): every call into the core
// is one message in and one message out, in protobuf binary encoding.
//
// Exports of substantial.wasm, which imports nothing:
//   sub_alloc(len) -> ptr                memory for a request of len bytes
//   sub_free(ptr, len)                   frees a response, or a request never passed to the module
//   sub_new(kind, ptr, len) -> machine   kind is a MachineKind, the request its RunInput, AgentConfig
//                                        or PlanInput
//   sub_call(machine, ptr, len) -> u64   the request is the machine's RunRequest, AgentRequest or
//                                        PlanRequest; the answer its response, as ptr << 32 | len
//   sub_refused(machine) -> u64          the error sub_new refused the machine's input with, a
//                                        response as ptr << 32 | len, or 0 for a machine made
//   sub_drop(machine)                    frees a machine
//
// Ownership: sub_new and sub_call take the request buffer and free it, whatever the outcome. A
// response belongs to the host, which frees it with sub_free once read.
//
// Errors: every response has CoreError error = 1, so an error decodes the same whatever the kind.
// sub_new never returns 0: given an unknown kind or an input that does not decode or is invalid, it
// returns a machine that answers every call with that error, and must still be dropped. A host
// asks sub_refused right after sub_new, so an invalid input (an AgentConfig refused, such as prices
// in a currency outside ISO 4217) fails where it is given rather than at the first call. A request
// that does not decode is answered with an error and leaves the machine as it was; so does a call
// on a machine that does not exist. A trap is a bug of the core: the host drops the instance.
syntax = "proto3";

package substantial.boundary.v1;

enum MachineKind {
  MACHINE_KIND_UNSPECIFIED = 0;
  MACHINE_KIND_RUN = 1;
  MACHINE_KIND_AGENT = 2;
  MACHINE_KIND_PLAN = 3;
}

message Empty {
}

enum ErrorKind {
  ERROR_KIND_UNSPECIFIED = 0;
  ERROR_KIND_NON_DETERMINISM = 1;
  ERROR_KIND_INVALID = 2;
  ERROR_KIND_ENDED = 3;
  ERROR_KIND_CORRUPT = 4;
  ERROR_KIND_LAYOUT = 5;
  // A value of the code whose encoding passes 64 MiB, the limit of I-15: the call is refused and
  // records nothing. The message gives its size and the limit.
  ERROR_KIND_VALUE_TOO_LARGE = 6;
}

message CoreError {
  ErrorKind kind = 1;
  string message = 2;
}

// The store contract's six operations (I-26): create, cas, get, list and delete, and an expiry
// in whole days that every write carries.
//
// Expiry: a write with expiry_days sets its key to expire that many days after the write lands,
// 1 to 36,500; a write without it clears any expiry the key had. The key reads as written until at
// least the write plus expiry_days, and is removed, get answering missing and create writing, at
// the latest 2 days after that; between the two it may read either way, but once removed it stays
// removed until a new write. A key past its expiry and not yet removed may still be listed: the
// core lists no key it writes with an expiry.
//
// ETags are opaque: an etag changes whenever the bytes change, and may change on a write of equal
// bytes too. The core never compares them, it only names one in a cas.
//
// An ambiguous answer (a timeout, a dropped connection) is resolved by the adapter with one get,
// counted in attempts. For a create: equal bytes mean it landed (created, with that etag), missing
// means it is sent again, other bytes mean exists. For a cas: equal bytes mean it landed (written,
// with that etag), the etag named still current means it is sent again with the same bytes,
// anything else means mismatch. No bucket versioning is needed for either.
message StoreOp {
  message Create {
    string key = 1;
    bytes bytes = 2;
    optional uint32 expiry_days = 3;
  }
  // Writes bytes only if the key's current value has the etag, atomically with every other
  // operation on the key; a missing key answers mismatch.
  message Cas {
    string key = 1;
    bytes bytes = 2;
    string etag = 3;
    optional uint32 expiry_days = 4;
  }
  message List {
    string prefix = 1;
    optional string start_after = 2;
    uint32 max_keys = 3;
    ListWait wait = 4;
  }
  oneof op {
    Create create = 1;
    string get = 2;
    List list = 3;
    string delete = 4;
    Cas cas = 5;
  }
}

message ListWait {
  optional string etag = 1;
  uint32 seconds = 2;
}

// The store failed after the adapter's own retries.
message StoreFailure {
  string message = 1;
}

message OpResult {
  message Listing {
    repeated string keys = 1;
    optional string etag = 2;
  }
  // A write that landed: the etag of the value written, for a later cas.
  message Written {
    string etag = 1;
  }
  // A get: the key's value and its etag.
  message Object {
    bytes bytes = 1;
    string etag = 2;
  }
  // A get answered bytes alone before the etag existed.
  reserved 3;
  reserved "bytes";
  oneof result {
    // A create that wrote.
    Written created = 1;
    // A create that found the key.
    Empty exists = 2;
    Object object = 11;
    Empty missing = 4;
    Listing listing = 5;
    Empty deleted = 6;
    StoreFailure failed = 7;
    // A cas that wrote.
    Written written = 9;
    // A cas whose etag is not the key's current one, or whose key is missing.
    Empty mismatch = 10;
  }
  // The requests the adapter sent for the operation, its retries and read-backs included: at least
  // 1 on every result fed to an agent or a run machine, which count them; plans ignore it.
  uint32 attempts = 8;
}
