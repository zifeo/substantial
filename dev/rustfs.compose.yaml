# RustFS for the S3 tests of the Rust host, on 127.0.0.1:39400, bucket `substantial`.
#
#   docker compose -f dev/rustfs.compose.yaml up -d --wait
#   AWS_ACCESS_KEY_ID=substantial AWS_SECRET_ACCESS_KEY=substantial-secret \
#   SUBSTANTIAL_S3_URL='s3+http://127.0.0.1:39400/substantial/tests?region=us-east-1' \
#   cargo test --workspace
#   docker compose -f dev/rustfs.compose.yaml down
#
# Without SUBSTANTIAL_S3_URL the S3 tests are skipped, each saying so.
name: substantial-rustfs

services:
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: substantial-rustfs
    ports:
      - "127.0.0.1:39400:9000"
    environment:
      RUSTFS_ACCESS_KEY: substantial
      RUSTFS_SECRET_KEY: substantial-secret
    tmpfs:
      - /data:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 1s
      retries: 30

  bucket:
    image: rustfs/rustfs:1.0.1
    container_name: substantial-rustfs-bucket
    depends_on:
      rustfs:
        condition: service_healthy
    # Healthy comes before RustFS accepts signed requests; 409 is a bucket made by an earlier run.
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 30); do
          code=$$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
            --user substantial:substantial-secret -X PUT http://rustfs:9000/substantial)
          case $$code in 200|409) exit 0;; esac
          sleep 1
        done
        echo "cannot create the bucket: HTTP $$code" >&2
        exit 1
