[package]
name = "substantial-guest"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Workflows of Substantial compiled to WebAssembly components, run by its Rust host"

[dependencies]
chrono = { version = "0.4.34", default-features = false, features = ["alloc"] }
serde = { version = "1.0.60", features = ["derive"] }
serde_json = "1"
substantial-macros = { version = "0.3.0", path = "../macros" }
wit-bindgen = { version = "0.51", default-features = false, features = ["macros", "realloc", "std"] }

# The guests of the Rust host's tests, built for wasm32-unknown-unknown and componentized there.
[[example]]
name = "sleep_then_step"
crate-type = ["cdylib"]

[[example]]
name = "receive_with_timeout"
crate-type = ["cdylib"]

[[example]]
name = "bounds"
crate-type = ["cdylib"]

[dev-dependencies]
wit-bindgen = { version = "0.51", default-features = false, features = ["macros", "realloc", "std"] }
