[package]
name = "substantial-wasm-sdk"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The API of Substantial's Wasm workflows, which the crate `substantial` re-exports for wasm32: depend on it"

[dependencies]
chrono = { version = "0.4.34", default-features = false, features = ["alloc"] }
serde = { version = "1.0.60", features = ["derive"] }
serde_json = "1"
substantial-macros = { version = "0.4.0", path = "../macros" }
wit-bindgen = { version = "0.51", default-features = false, features = ["macros", "realloc", "std"] }
